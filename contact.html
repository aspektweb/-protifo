<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aloqa | Axak</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f0f13 0%, #1a1a24 50%, #0d1117 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-glow {
      transition: all 0.3s ease;
    }
    .btn-glow:hover {
      transform: scale(1.04);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);
    }
    .btn-glow:active { transform: scale(0.97); }
    .nav-link { position: relative; transition: color 0.3s; }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; width: 0; height: 2px;
      background: #818cf8; transition: width 0.3s ease;
    }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    input, textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(255,255,255,0.06);
    }
  </style>
</head>
<body class="text-gray-200">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/5">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-semibold tracking-tight text-white">
        Axak<span class="text-indigo-400">.</span>
      </a>
      <div class="hidden md:flex items-center gap-8 text-sm">
        <a href="index.html" class="nav-link text-gray-400 hover:text-white">Bosh sahifa</a>
        <a href="projects.html" class="nav-link text-gray-400 hover:text-white">Loyihalar</a>
        <a href="contact.html" class="nav-link active text-white">Aloqa</a>
        <a href="admin.html" class="btn-glow px-4 py-2 rounded-lg bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-sm">Admin</a>
      </div>
      <button id="menuBtn" class="md:hidden text-gray-300 text-xl"><i class="fas fa-bars"></i></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden px-5 pb-4 space-y-3">
      <a href="index.html" class="block text-gray-400">Bosh sahifa</a>
      <a href="projects.html" class="block text-gray-400">Loyihalar</a>
      <a href="contact.html" class="block text-white">Aloqa</a>
      <a href="admin.html" class="block text-indigo-300">Admin</a>
    </div>
  </nav>

  <!-- Contact Form -->
  <section class="pt-32 pb-20 px-5">
    <div class="max-w-xl mx-auto">
      <div class="text-center mb-10">
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-3">Bog‘lanish</h1>
        <p class="text-gray-400">Savolingiz yoki taklifingiz bo‘lsa, yozing.</p>
      </div>

      <form id="contactForm" class="glass rounded-2xl p-7 space-y-5">
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Ismingiz</label>
          <input type="text" name="name" required placeholder="Ismingizni yozing"
            class="w-full px-4 py-3 rounded-xl text-white placeholder-gray-500" />
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Email</label>
          <input type="email" name="email" required placeholder="email@example.com"
            class="w-full px-4 py-3 rounded-xl text-white placeholder-gray-500" />
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Telefon (ixtiyoriy)</label>
          <input type="tel" name="phone" placeholder="+998 XX XXX XX XX"
            class="w-full px-4 py-3 rounded-xl text-white placeholder-gray-500" />
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Mavzu</label>
          <input type="text" name="subject" required placeholder="Mavzu"
            class="w-full px-4 py-3 rounded-xl text-white placeholder-gray-500" />
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Xabar</label>
          <textarea name="message" required rows="5" placeholder="Xabaringizni yozing..."
            class="w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 resize-none"></textarea>
        </div>
        <button type="submit" class="btn-glow w-full py-3.5 rounded-xl bg-indigo-500 text-white font-medium">
          Yuborish
        </button>
        <p id="formMsg" class="text-center text-sm hidden"></p>
      </form>
    </div>
  </section>

  <footer class="border-t border-white/5 py-8 px-5 text-center text-gray-500 text-sm">
    <p>© 2026 Axak. Barcha huquqlar himoyalangan.</p>
  </footer>

  <script>
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('mobileMenu').classList.toggle('hidden');
    });

    // Form yuborish (backend tayyor bo'lganda ishlaydi)
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('formMsg');
      msg.classList.remove('hidden');
      msg.className = 'text-center text-sm text-indigo-300';
      msg.textContent = 'Yuborilmoqda...';

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);

      try {
        // Backend ishga tushganda shu URL ishlaydi
        const res = await fetch('http://localhost:5000/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
          msg.className = 'text-center text-sm text-emerald-400';
          msg.textContent = 'Xabaringiz muvaffaqiyatli yuborildi!';
          e.target.reset();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        msg.className = 'text-center text-sm text-amber-400';
        msg.textContent = 'Hozircha server ishlamayapti. Keyinroq qayta urinib ko‘ring.';
      }
    });
  </script>
</body>
</html>
